# Serves the artifacts at their download path (`dl/<name>/<version>/<file>.tar.gz`),
# which is also their path in the artifacts volume, and the static HTTP mirror of the
# index (`index/`, `git_db/mirror.py`). Django writes them, nginx only reads.
server {
    listen 80;
    server_name _;

    root /srv/artifacts;
    autoindex off;

    location /dl/ {
        types {
            application/gzip gz;
        }
        default_type application/octet-stream;
        # for the browser client; `always` also adds it to 404/410
        add_header Access-Control-Allow-Origin "*" always;
        # a hard-deleted artifact has an empty marker at gone/<download path>
        # (`packages/deletion.py`), checked per request, so no reload is needed
        if (-f /srv/artifacts/gone$uri) {
            return 410;
        }
        # artifacts are never replaced, so clients may cache them forever
        # (without `always`: not on errors)
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /index/ {
        types {
            application/json json jsonl;
        }
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        # files change in place, clients revalidate with the ETag nginx sends
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# The docs of the packages (`docs/<name>/`, a symlink to its build in `docs/.builds/`,
# written by the docs worker, see docs_plan.md) on a port of their own, in production
# a host of their own: package-authored pages can't act on the main site's session.
server {
    listen 81;
    server_name _;

    root /srv/artifacts/docs;
    index index.html;
    autoindex off;
    # relative redirects (`/foo` → `/foo/`), the port inside differs from outside
    absolute_redirect off;

    # SCDoc's pages need inline scripts (helpRoot, onload), nothing else may be loaded
    # from elsewhere or sent anywhere (also in `docs/views.py` for runserver)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # the build folders and temporary links
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
