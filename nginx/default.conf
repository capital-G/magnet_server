# Serves the artifacts at their download path (`dl/<name>/<version>/<file>.tar.gz`),
# which is also their path in the artifacts volume. Django writes them, nginx only reads.
server {
    listen 80;
    server_name _;

    root /srv/artifacts;
    autoindex off;

    location /dl/ {
        types {
            application/gzip gz;
        }
        default_type application/octet-stream;
        # artifacts are never replaced, so clients may cache them forever
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
