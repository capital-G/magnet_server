{% with assets=release.assets.all %}
{% if assets %}
<table class="table is-fullwidth is-hoverable">
    <thead>
        <tr>
            <th>Filename</th>
            <th>Kind</th>
            <th>ABI</th>
            <th>Platform</th>
        </tr>
    </thead>
    <tbody>
        {% for asset in assets %}
        <tr>
            <td>
                <a href="{{ asset.file.url }}">{{ asset.identifier }}</a>
                <a class="has-text-grey is-size-7 ml-2" href="{% url 'asset-detail' asset.uuid %}">[details]</a>
            </td>
            <td>{{ asset.kind }}</td>
            <td>{{ asset.abi }}</td>
            <td>{{ asset.platform }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
    <p class="has-text-grey">No assets for v{{ release.version }}.</p>
{% endif %}
{% endwith %}
