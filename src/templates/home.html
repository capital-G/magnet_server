{% extends "base.html" %}

{% block content %}
<section class="hero is-link is-medium">
    <div class="hero-body">
        <div class="container has-text-centered">
            <h1 class="title is-2">The SuperCollider package registry</h1>
            <p class="subtitle is-5 mb-5">{{ project_count }} package{{ project_count|pluralize }} available</p>
            <form action="{% url 'projects-list' %}" method="get">
                <div class="field has-addons has-addons-centered">
                    <div class="control is-expanded" style="max-width: 520px;">
                        <input class="input is-medium" type="search" name="q" placeholder="Search projects ..." autofocus>
                    </div>
                    <div class="control">
                        <button class="button is-dark is-medium" type="submit">Search</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
