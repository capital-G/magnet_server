server.modules = (
    "mod_alias",
    "mod_cgi",
    "mod_rewrite",
    "mod_accesslog",
)

server.document-root = "/usr/share/gitweb"
server.port = 80

accesslog.filename = "/dev/stderr"
server.errorlog = "/dev/stderr"

mimetype.assign = (
    ".css" => "text/css",
    ".js"  => "application/javascript",
    ".png" => "image/png",
    ".ico" => "image/x-icon",
)

cgi.assign = ( ".cgi" => "" )

url.rewrite-once = (
    "^/static/(.*)$" => "$0",
    "^(.*)$" => "/gitweb.cgi$1",
)
