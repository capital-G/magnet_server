server.modules = (
    "mod_alias",
    "mod_setenv",
    "mod_cgi",
    "mod_rewrite",
    "mod_accesslog",
)

server.document-root = "/usr/share/gitweb"
server.port = 80

accesslog.filename = "/dev/stderr"
server.errorlog = "/dev/stderr"

mimetype.assign = (
    ".css" => "text/css",
    ".js"  => "application/javascript",
    ".png" => "image/png",
    ".ico" => "image/x-icon",
)

cgi.assign = ( ".cgi" => "" )

# The index for the CLI over git's smart HTTP protocol (libgit2 can't fetch "dumb"
# static files): only git's own requests go to git-http-backend, which refuses
# pushes without a logged-in user (and the volume is read-only anyway).
alias.url = ( "/git-http-backend" => "/usr/lib/git-core/git-http-backend" )

$HTTP["url"] =~ "^/git-http-backend/" {
    cgi.assign = ( "" => "" )
    setenv.add-environment = (
        "GIT_PROJECT_ROOT" => "/srv/git",
        "GIT_HTTP_EXPORT_ALL" => "",
    )
}

url.rewrite-once = (
    "^/([^/]+\.git/(info/refs|git-upload-pack|git-receive-pack).*)$" => "/git-http-backend/$1",
    "^/static/(.*)$" => "$0",
    "^(.*)$" => "/gitweb.cgi$1",
)
