volumes:
  db:
  media:
  venv:

services:
  server:
    build: .
    depends_on:
      - database
    env_file:
      - .local.env
    volumes:
      - media:/app/media
      - ${LOCAL_MAGNET_INDEX_PATH}:/srv/git/magnet_index.git:ro
    environment:
      - GIT_INDEX_REPO_PATH=/srv/git/magnet_index.git
    ports:
      - ${MAGNET_PORT:-8000}:8000

  database:
    image: postgres:17-alpine
    env_file:
      - .local.env
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    volumes:
      - media:/usr/share/nginx/html/media

  git_web:
    build: git_server
    command: ["lighttpd", "-D", "-f", "/etc/lighttpd/lighttpd.conf"]
    volumes:
      - ${LOCAL_MAGNET_INDEX_PATH}:/srv/git/magnet_index.git:ro
    ports:
      - ${GIT_WEB_PORT:-8080}:80

  git_daemon:
    build: git_server
    command: ["git", "daemon", "--reuseaddr", "--base-path=/srv/git", "--export-all", "--verbose", "/srv/git"]
    volumes:
      - ${LOCAL_MAGNET_INDEX_PATH}:/srv/git/magnet_index.git:ro
    ports:
      - ${GIT_DAEMON_PORT:-9418}:9418
