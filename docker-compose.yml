# Local test stack, see README.md. Do NOT use this in production!
#
#   http://localhost:8000          Django (frontend, admin, API)
#   http://localhost:8080/dl/…     artifact downloads (nginx)
#   http://localhost:8080/index/…  static HTTP mirror of the index (nginx)
#   git://localhost:9418/magnet_index.git   the index (git daemon)
#   http://localhost:8081          the index in gitweb
#   (worker)                       background tasks, e.g. class extraction
#   (docs_worker)                  docs builds, needs `make docs-builder`

volumes:
  db:
  # the bare index repository, written by `server` only
  index:
  # the artifacts at their download path and the index mirror (`index/`),
  # written by `server` only
  artifacts:

services:
  server:
    build:
      context: .
      target: server
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .local.env
    environment:
      - GIT_INDEX_REPO_PATH=/srv/git/magnet_index.git
      - MAGNET_ARTIFACTS_ROOT=/srv/artifacts
      - MAGNET_DOWNLOAD_BASE_URL=http://localhost:${NGINX_PORT:-8080}/
      - MAGNET_API_BASE_URL=http://localhost:${MAGNET_PORT:-8000}/
      - MAGNET_OAUTH_REDIRECT_URIS=http://localhost:${MAGNET_PORT:-8000}/users/display-token http://127.0.0.1:${MAGNET_PORT:-8000}/users/display-token
    volumes:
      - index:/srv/git
      - artifacts:/srv/artifacts
    ports:
      - ${MAGNET_PORT:-8000}:8000
    # healthy once the entrypoint has migrated and gunicorn answers
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # runs the background tasks of the queue "default" (class extraction)
  worker:
    build:
      context: .
      target: server
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["python", "manage.py", "db_worker", "--queue-name", "default", "--no-reload"]
    env_file:
      - .local.env
    environment:
      - MAGNET_ARTIFACTS_ROOT=/srv/artifacts
    volumes:
      - artifacts:/srv/artifacts:ro

  # runs the docs builds (queue "docs") in containers of the builder image
  # (`make docs-builder`), started through the container engine's socket
  docs_worker:
    build:
      context: .
      target: docs_worker
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["python", "manage.py", "db_worker", "--queue-name", "docs", "--no-reload"]
    # SELinux (e.g. podman machine's VM) keeps containers from using the socket
    security_opt:
      - label=disable
    env_file:
      - .local.env
    environment:
      - MAGNET_ARTIFACTS_ROOT=/srv/artifacts
      - MAGNET_DOCS_RUNNER=docker
      - DOCKER_HOST=unix:///run/engine.sock
      # the engine resolves the work dirs of the build containers on its host
      - MAGNET_DOCS_WORK_DIR=/tmp/magnet-docs-work
      # `magnet install` reaches the stack's published ports from the host's network
      - MAGNET_DOCS_INSTALL_NETWORK=host
      - MAGNET_DOCS_GIT_INDEX_URL=git://localhost:${GIT_DAEMON_PORT:-9418}/magnet_index.git
    volumes:
      - artifacts:/srv/artifacts
      # podman machine's (rootful) socket; Docker: /var/run/docker.sock, rootless
      # podman: /run/user/<uid>/podman/podman.sock
      - ${MAGNET_DOCS_SOCKET:-/run/podman/podman.sock}:/run/engine.sock
      - type: bind
        source: /tmp/magnet-docs-work
        target: /tmp/magnet-docs-work
        bind:
          create_host_path: true

  database:
    image: postgres:17-alpine
    env_file:
      - .local.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - db:/var/lib/postgresql/data

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - artifacts:/srv/artifacts:ro
    ports:
      - ${NGINX_PORT:-8080}:80

  git_daemon:
    build: git_server
    command: ["git", "daemon", "--reuseaddr", "--base-path=/srv/git", "--export-all", "--verbose", "/srv/git"]
    volumes:
      - index:/srv/git:ro
    ports:
      - ${GIT_DAEMON_PORT:-9418}:9418

  git_web:
    build: git_server
    command: ["lighttpd", "-D", "-f", "/etc/lighttpd/lighttpd.conf"]
    volumes:
      - index:/srv/git:ro
    ports:
      - ${GIT_WEB_PORT:-8081}:80
