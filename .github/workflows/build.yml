name: build

on:
  pull_request:
  push:
    branches:
        - main
        - develop

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  tests:
    name: "Run tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # the version of the Docker image, not the newest `requires-python` allows
          python-version-file: '.python-version'
      - uses: pre-commit/action@v3.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest
        working-directory: src/

      - name: Run mypy
        run: uv run mypy .
        working-directory: src/
