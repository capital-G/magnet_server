[project]
name = "magnet-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "django==6.0.*",
    "django-allauth>=65.15.0",
    "django-filter>=25.2",
    "django-htmx>=1.27.0",
    "django-markdownify>=0.9.6",
    "django-oauth-toolkit>=3.2.0",
    "djangorestframework>=3.16.0",
    "drf-nested-routers>=0.94.2",
    "drf-spectacular>=0.28.0",
    "gunicorn>=25.1.0",
    "jsonschema>=4.26.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.11.7",
    "whitenoise>=6.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "magnet.settings"
python_files = ["**/tests/*.py"]
# in parallel; `-n0` for a single test or `--pdb`
addopts = "-n auto"
filterwarnings = [
    # whitenoise: tests don't run collectstatic, so STATIC_ROOT doesn't exist
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "I", "B", "UP", "DJ"]
# line length is up to the formatter
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# settings variants extend the base settings via star import
"src/magnet/settings_*.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E", "I", "UP"]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
module = ["oauth2_provider.*", "allauth.*", "django.tasks.*"]
follow_untyped_imports = true

[tool.django-stubs]
django_settings_module = "magnet.settings"

[dependency-groups]
dev = [
    "django-stubs==5.2.2",
    "djangorestframework-stubs==3.16.1",
    "factory-boy>=3.3.3",
    "mypy==1.17",
    "pytest-django>=4.11.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
    "types-jsonschema>=4.26.0.20261006",
]
