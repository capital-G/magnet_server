# The host's nginx in front of deploy/compose.yml: TLS and routing by host name to
# the stack's ports on 127.0.0.1. Copy to /etc/nginx/sites-available/magnet, link it
# into sites-enabled, `sudo nginx -t && sudo systemctl reload nginx`.
#
# One certificate for the three names (certbot's own TLS settings):
#   sudo certbot certonly --nginx -d magnet.supercollider.online \
#       -d git.magnet.supercollider.online -d package-docs.magnet.supercollider.online

server {
    listen 80;
    listen [::]:80;
    server_name magnet.supercollider.online git.magnet.supercollider.online
                package-docs.magnet.supercollider.online;
    return 301 https://$host$request_uri;
}

# the website and API (Django), downloads and the index mirror (static nginx)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name magnet.supercollider.online;

    ssl_certificate /etc/letsencrypt/live/magnet.supercollider.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magnet.supercollider.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # uploads of `magnet publish`, like MAGNET_MAX_UPLOAD_SIZE
    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Django trusts it (SECURE_PROXY_SSL_HEADER), so it must always be set here
    proxy_set_header X-Forwarded-Proto $scheme;

    location /dl/ {
        proxy_pass http://127.0.0.1:8311;
    }

    location /index/ {
        proxy_pass http://127.0.0.1:8311;
    }

    location / {
        proxy_pass http://127.0.0.1:8310;
    }
}

# the index for the CLI (git's smart HTTP) and gitweb
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name git.magnet.supercollider.online;

    ssl_certificate /etc/letsencrypt/live/magnet.supercollider.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magnet.supercollider.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8313;
        proxy_set_header Host $host;
    }
}

# the package docs, on a host of their own (their pages can't reach the site's session)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name package-docs.magnet.supercollider.online;

    ssl_certificate /etc/letsencrypt/live/magnet.supercollider.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magnet.supercollider.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8312;
        proxy_set_header Host $host;
    }
}
